services:
  postgres:
    image: ankane/pgvector
    container_name: nexus-postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data_nexus:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nexus

volumes:
  postgres_data_nexus:
